const world=document.getElementById('world'),p=document.getElementById('player'),state=document.getElementById('state'),orb=document.getElementById('orb');p.innerHTML=master();let x=90,y=0,vy=0,L=0,R=0,face=1,last=performance.now(),history=[],energy=0;
function bind(id,k){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(k==='L')L=1;else R=1};b.onpointerup=b.onpointercancel=()=>{if(k==='L')L=0;else R=0}}bind('left','L');bind('right','R');function jump(){if(y===0)vy=12}jumpBtn=document.getElementById('jump');jumpBtn.onpointerdown=e=>{e.preventDefault();jump()};let actionUntil=0,actionDir=1,landUntil=0;document.getElementById('action').onpointerdown=e=>{e.preventDefault();if(performance.now()>actionUntil){actionDir=face;actionUntil=performance.now()+360}};document.getElementById('rewind').onpointerdown=e=>{e.preventDefault();if(energy&&history.length){const h=history[Math.max(0,history.length-120)];x=h.x;y=h.y;vy=h.vy;energy--;orb.style.display='block'}};

function loop(t){const dt=Math.min((t-last)/16.67,2);last=t;let acting=t<actionUntil,dx=(R-L)*5*dt;if(acting)dx=actionDir*11*dt;if(dx){x+=dx;face=dx<0?-1:1}if(vy||y){let was=y;y+=vy*dt;vy-=.68*dt;if(y<0){y=0;vy=0;if(was>0)landUntil=t+130}}x=Math.max(-35,Math.min(innerWidth-157,x));history.push({x,y,vy,face});if(history.length>180)history.shift();if(Math.floor(t/100)%5===0&&(acting||y))ghost({x,y,face});p.style.left=x+'px';p.style.bottom=(111+y)+'px';let pose='scaleX('+face+')';if(y){const s=Math.max(-.035,Math.min(.035,vy*.003));pose+=' scale('+(1-s)+','+(1+s)+')'}else if(t<landUntil)pose+=' scale(1.045,.955)';p.style.transform=pose;
if(acting){p.innerHTML=master();state.textContent='PEEL DASH'}else if(dx&&!y){const phase=Math.floor(t/92)%8;p.innerHTML=walkArt(phase);state.textContent='WALK • '+(phase+1)+'/8'}else{p.innerHTML=master();state.textContent=y?(vy>1?'JUMP ↑':vy<-1?'FALL ↓':'APEX'):(t<landUntil?'LAND':'IDLE')}
