<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Banana: Peel Back</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0d;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#world{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#24242b,#0d0d10 70%)}#ground{position:absolute;left:0;right:0;bottom:108px;height:3px;background:#555}.banana{position:absolute;width:192px;height:192px;transform-origin:center bottom;image-rendering:pixelated;will-change:transform}.banana svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}.ghost{opacity:.12;filter:grayscale(1)}#hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;z-index:5;font-weight:800;font-size:13px}#hint{opacity:.55;font-weight:600;margin-top:5px}#controls{position:absolute;left:18px;right:18px;bottom:max(20px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;z-index:9}.side{display:flex;gap:10px}button{height:70px;min-width:70px;padding:0 18px;border:2px solid #aaa;border-radius:18px;background:#202024;color:white;font-size:28px;font-weight:850;touch-action:none}#jump{border-radius:50%;width:82px;padding:0;font-size:13px}#rewind,#action{font-size:11px;letter-spacing:.03em}#orb{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff;bottom:170px;left:75%;animation:pulse 1s infinite alternate}@keyframes pulse{to{transform:scale(1.4);opacity:.55}}</style></head><body><div id="world"><div id="hud"><div id="state">IDLE</div><div id="hint">白い光を取る → REWINDで2秒前へ戻る</div></div><div id="orb"></div><div id="ground"></div><div id="player" class="banana"></div><div id="controls"><div class="side"><button id="left">←</button><button id="right">→</button></div><div class="side"><button id="action">PEEL DASH</button><button id="rewind">REWIND</button><button id="jump">JUMP</button></div></div></div><script>
const RUNS=[[24,3,4,2],[23,4,6,2],[22,5,7,2],[23,6,6,2],[20,7,3,1],[27,7,1,2],[19,8,7,1],[19,9,8,1],[18,10,10,1],[18,11,10,1],[18,12,11,1],[17,13,12,1],[17,14,13,1],[16,15,14,1],[16,16,15,1],[15,17,16,1],[15,18,6,1],[21,18,1,3],[23,18,4,1],[27,18,1,3],[29,18,2,1],[15,19,6,1],[23,19,4,1],[29,19,2,1],[15,20,6,1],[23,20,4,1],[29,20,2,1],[15,21,6,1],[23,21,4,1],[29,21,2,1],[15,22,16,1],[15,23,16,1],[15,24,8,1],[27,24,4,1],[15,25,16,1],[15,26,16,1],[15,27,16,1],[14,28,17,1],[14,29,17,1],[13,30,4,1],[18,30,13,1],[32,30,1,1],[13,31,4,1],[18,31,13,1],[32,31,2,1],[12,32,4,1],[17,32,14,1],[32,32,2,1],[12,33,3,1],[16,33,15,1],[32,33,3,1],[12,34,4,1],[17,34,14,1],[32,34,3,1],[12,35,4,1],[17,35,14,1],[33,35,2,1],[13,36,3,1],[17,36,13,1],[16,37,13,1],[16,38,12,1],[16,39,12,1],[16,40,2,1],[20,40,7,1],[16,41,2,1],[21,41,5,1],[27,41,1,1],[16,42,2,1],[26,42,2,1],[16,43,3,1],[26,43,3,1],[16,44,5,1],[26,44,5,1],[16,45,5,1],[26,45,5,1]];
const C=['#000','#fedd15','#704421','#fff'];
const LIMB_ZONES=[{x1:10,x2:18,y1:28,y2:38},{x1:31,x2:37,y1:28,y2:38},{x1:15,x2:22,y1:39,y2:47},{x1:25,x2:32,y1:39,y2:47}];
function inLimbZone(x,y){return LIMB_ZONES.some(z=>x>=z.x1&&x<=z.x2&&y>=z.y1&&y<=z.y2)}
function baseRuns(){return RUNS.filter(r=>{for(let x=r[0];x<r[0]+r[2];x++)if(inLimbZone(x,r[1]))return false;return true})}
const WALK=[
 {la:[[-1,0],[-1,1]],ra:[[1,0],[1,-1]],ll:[[-3,0],[-4,1]],rl:[[3,-1],[4,0]]},
 {la:[[-1,1]],ra:[[1,-1]],ll:[[-2,1],[-3,1]],rl:[[2,-1],[3,0]]},
 {la:[[0,1]],ra:[[0,-1]],ll:[[-1,0],[0,0]],rl:[[1,-2],[2,-2]]},
 {la:[[1,0]],ra:[[-1,0]],ll:[[2,-1],[3,-1]],rl:[[-1,-2],[0,-2]]},
 {la:[[1,0],[1,-1]],ra:[[-1,0],[-1,1]],ll:[[3,-1],[4,0]],rl:[[-3,0],[-4,1]]},
 {la:[[1,-1]],ra:[[-1,1]],ll:[[2,-1],[3,0]],rl:[[-2,1],[-3,1]]},
 {la:[[0,-1]],ra:[[0,1]],ll:[[1,-2],[2,-2]],rl:[[-1,0],[0,0]]},
 {la:[[-1,0]],ra:[[1,0]],ll:[[-1,-2],[0,-2]],rl:[[2,-1],[3,-1]]}
];
function rectsFromRuns(src){let s='';for(const r of src)s+='<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="1" fill="'+C[r[3]]+'"/>';return s}
function originalZone(zone){return RUNS.filter(r=>r[1]>=zone.y1&&r[1]<=zone.y2&&r[0]+r[2]-1>=zone.x1&&r[0]<=zone.x2)}
function shifted(zone,delta){const [dx,dy]=delta;return originalZone(zone).map(r=>[r[0]+dx,r[1]+dy,r[2],r[3]])}
function art(phase=-1){let s='<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">';if(phase<0){s+=rectsFromRuns(RUNS)}else{const w=WALK[phase];s+=rectsFromRuns(baseRuns());const z=LIMB_ZONES;s+=rectsFromRuns(shifted(z[0],w.la[0]));s+=rectsFromRuns(shifted(z[1],w.ra[0]));s+=rectsFromRuns(shifted(z[2],w.ll[0]));s+=rectsFromRuns(shifted(z[3],w.rl[0]))}return s+'</svg>'}
const world=document.getElementById('world'),p=document.getElementById('player'),state=document.getElementById('state'),orb=document.getElementById('orb');p.innerHTML=art();let x=90,y=0,vy=0,L=0,R=0,face=1,last=performance.now(),history=[],energy=0;
function bind(id,k){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(k==='L')L=1;else R=1};b.onpointerup=b.onpointercancel=()=>{if(k==='L')L=0;else R=0}}bind('left','L');bind('right','R');
function jump(){if(y===0)vy=12}document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jump()};
let actionUntil=0,actionDir=1,landUntil=0;
document.getElementById('action').onpointerdown=e=>{e.preventDefault();if(performance.now()>actionUntil){actionDir=face;actionUntil=performance.now()+360;state.textContent='PEEL DASH!'}};
document.getElementById('rewind').onpointerdown=e=>{e.preventDefault();if(energy&&history.length){const h=history[Math.max(0,history.length-120)];x=h.x;y=h.y;vy=h.vy;energy--;orb.style.display='block';state.textContent='PEEL BACK!'}};
function ghost(g){const d=document.createElement('div');d.className='banana ghost';d.innerHTML=art();d.style.left=g.x+'px';d.style.bottom=(111+g.y)+'px';d.style.transform='scaleX('+g.face+')';world.insertBefore(d,document.getElementById('controls'));setTimeout(()=>d.remove(),450)}
function loop(t){const dt=Math.min((t-last)/16.67,2);last=t;let now=t,acting=now<actionUntil,dx=(R-L)*5*dt;if(acting)dx=actionDir*11*dt;if(dx){x+=dx;face=dx<0?-1:1}if(vy||y){let was=y;y+=vy*dt;vy-=.68*dt;if(y<0){y=0;vy=0;if(was>0)landUntil=now+130}}x=Math.max(-35,Math.min(innerWidth-157,x));history.push({x,y,vy,face});if(history.length>180)history.shift();if(Math.floor(t/100)%5===0&&(dx||y))ghost({x,y,face});
p.style.left=x+'px';p.style.bottom=(111+y)+'px';p.style.transform='scaleX('+face+')';
if(acting){const phase=Math.floor(t/55)%8;p.innerHTML=art(phase);state.textContent='PEEL DASH'}else if(dx&&!y){const phase=Math.floor(t/82)%8;p.innerHTML=art(phase);state.textContent='RUN • '+(phase+1)+'/8'}else{p.innerHTML=art();state.textContent=y?(vy>1?'JUMP ↑':vy<-1?'FALL ↓':'APEX'):(now<landUntil?'LAND':'IDLE')}
let pose='scaleX('+face+')';if(y){const s=Math.max(-.035,Math.min(.035,vy*.003));pose+=' scale('+(1-s)+','+(1+s)+')'}else if(now<landUntil)pose+=' scale(1.045,.955)';p.style.transform=pose;
const pr=p.getBoundingClientRect(),or=orb.getBoundingClientRect();if(orb.style.display!=='none'&&pr.right>or.left&&pr.left<or.right&&pr.bottom>or.top&&pr.top<or.bottom){orb.style.display='none';energy=1;state.textContent='TIME CHARGE GET!'}
document.getElementById('rewind').style.opacity=energy?1:.35;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
