<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Banana Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#world{position:relative;width:100%;height:100%;background:#151515;overflow:hidden}
#ground{position:absolute;left:0;right:0;bottom:0;height:105px;background:#252525;border-top:3px solid #555}
#banana{position:absolute;left:90px;bottom:105px;width:192px;height:192px;image-rendering:pixelated;transform-origin:center bottom;will-change:transform}
#banana svg{display:block;width:100%;height:100%;shape-rendering:crispEdges}
#status{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;font-size:13px;font-weight:800;z-index:3}
#controls{position:absolute;left:18px;right:18px;bottom:max(22px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;z-index:4}
.move{display:flex;gap:10px}button{width:68px;height:68px;border:2px solid #aaa;border-radius:16px;background:#222;color:#fff;font-size:30px;font-weight:800;touch-action:none}#jump{width:84px;height:84px;border-radius:50%;font-size:14px}
</style>
</head>
<body>
<div id="world">
<div id="status">BANANA MASTER / HTML+SVG BASE</div>
<div id="banana" aria-label="banana character">
<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g fill="#704421"><rect x="24" y="3" width="4" height="1"/><rect x="23" y="4" width="6" height="1"/><rect x="22" y="5" width="7" height="1"/><rect x="23" y="6" width="6" height="1"/><rect x="27" y="7" width="1" height="1"/></g>
<path fill="#fedd15" d="M20 7h3v1h3v1h1v1h1v2h1v1h1v2h1v2h1v13h1v2h1v1h1v3h-2v1h-3v1h-1v1h-1v2h-1v1h-1v4h-5v-1h-2v-1h-3v-5h-3v-1h-1v-4h1v-2h1v-3h1V17h1v-2h1v-2h1v-3h1V8h1z"/>
<g fill="#fedd15"><rect x="12" y="32" width="4" height="4"/><rect x="13" y="30" width="4" height="2"/><rect x="32" y="30" width="1" height="2"/><rect x="32" y="32" width="2" height="3"/><rect x="33" y="35" width="2" height="1"/><rect x="16" y="40" width="2" height="4"/><rect x="16" y="44" width="5" height="2"/><rect x="26" y="41" width="2" height="3"/><rect x="26" y="44" width="5" height="2"/></g>
<g fill="#000"><rect x="21" y="18" width="2" height="4"/><rect x="27" y="18" width="2" height="4"/><rect x="23" y="24" width="4" height="1"/><rect x="17" y="30" width="1" height="2"/><rect x="16" y="32" width="1" height="1"/><rect x="15" y="33" width="1" height="1"/><rect x="16" y="34" width="1" height="3"/><rect x="26" y="41" width="1" height="1"/></g>
<g fill="#fff"><rect x="21" y="18" width="1" height="1"/><rect x="27" y="18" width="1" height="1"/></g>
</svg>
</div>
<div id="ground"></div>
<div id="controls"><div class="move"><button id="left">←</button><button id="right">→</button></div><button id="jump">JUMP</button></div>
</div>
<script>
(()=>{const el=document.getElementById('banana'),world=document.getElementById('world'),status=document.getElementById('status');let x=90,y=0,vy=0,left=false,right=false,jumping=false,last=performance.now(),face=1;
function down(id,set){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});for(const ev of ['pointerup','pointercancel'])b.addEventListener(ev,e=>{e.preventDefault();set(false)})}
down('left',v=>left=v);down('right',v=>right=v);
function jump(){if(!jumping){vy=11;jumping=true}}
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')left=true;if(e.key==='ArrowRight')right=true;if(e.key===' '||e.key==='ArrowUp')jump()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false});
function tick(t){const dt=Math.min((t-last)/16.67,2);last=t;const dx=((right?1:0)-(left?1:0))*5*dt;if(dx){x+=dx;face=dx<0?-1:1}if(jumping){y+=vy*dt;vy-=.65*dt;if(y<=0){y=0;vy=0;jumping=false}}x=Math.max(0,Math.min(world.clientWidth-192,x));const idle=!left&&!right&&!jumping;const bob=idle?Math.round(Math.sin(t/420)):0;el.style.transform='translate3d('+Math.round(x-90)+'px,'+Math.round(-y+bob)+'px,0) scaleX('+face+')';status.textContent=jumping?'JUMP':(left||right?'MOVE':'IDLE');requestAnimationFrame(tick)}requestAnimationFrame(tick);
})();
</script>
</body>
</html>
