<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Banana: Peel Back</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0d;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#world{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#24242b,#0d0d10 70%)}#ground{position:absolute;left:0;right:0;bottom:108px;height:3px;background:#555}.banana{position:absolute;width:192px;height:192px;transform-origin:center bottom;image-rendering:pixelated;will-change:transform}.banana svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}.ghost{opacity:.12;filter:grayscale(1)}#hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;z-index:5;font-weight:800;font-size:13px}#hint{opacity:.55;font-weight:600;margin-top:5px}#controls{position:absolute;left:18px;right:18px;bottom:max(20px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;z-index:9}.side{display:flex;gap:10px}button{height:70px;min-width:70px;padding:0 18px;border:2px solid #aaa;border-radius:18px;background:#202024;color:white;font-size:28px;font-weight:850;touch-action:none}#jump{border-radius:50%;width:82px;padding:0;font-size:13px}#rewind{font-size:12px;letter-spacing:.04em}#orb{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff;bottom:170px;left:75%;animation:pulse 1s infinite alternate}@keyframes pulse{to{transform:scale(1.4);opacity:.55}}</style></head><body><div id="world"><div id="hud"><div id="state">IDLE</div><div id="hint">白い光を取る → REWINDで2秒前へ戻る</div></div><div id="orb"></div><div id="ground"></div><div id="player" class="banana"></div><div id="controls"><div class="side"><button id="left">←</button><button id="right">→</button></div><div class="side"><button id="rewind">REWIND</button><button id="jump">JUMP</button></div></div></div><script>
const RUNS=[[24,3,4,2],[23,4,6,2],[22,5,7,2],[23,6,6,2],[20,7,3,1],[27,7,1,2],[19,8,7,1],[19,9,8,1],[18,10,10,1],[18,11,10,1],[18,12,11,1],[17,13,12,1],[17,14,13,1],[16,15,14,1],[16,16,15,1],[15,17,16,1],[15,18,6,1],[21,18,1,3],[23,18,4,1],[27,18,1,3],[29,18,2,1],[15,19,6,1],[23,19,4,1],[29,19,2,1],[15,20,6,1],[23,20,4,1],[29,20,2,1],[15,21,6,1],[23,21,4,1],[29,21,2,1],[15,22,16,1],[15,23,16,1],[15,24,8,1],[27,24,4,1],[15,25,16,1],[15,26,16,1],[15,27,16,1],[14,28,17,1],[14,29,17,1],[13,30,4,1],[18,30,13,1],[32,30,1,1],[13,31,4,1],[18,31,13,1],[32,31,2,1],[12,32,4,1],[17,32,14,1],[32,32,2,1],[12,33,3,1],[16,33,15,1],[32,33,3,1],[12,34,4,1],[17,34,14,1],[32,34,3,1],[12,35,4,1],[17,35,14,1],[33,35,2,1],[13,36,3,1],[17,36,13,1],[16,37,13,1],[16,38,12,1],[16,39,12,1],[16,40,2,1],[20,40,7,1],[16,41,2,1],[21,41,5,1],[27,41,1,1],[16,42,2,1],[26,42,2,1],[16,43,3,1],[26,43,3,1],[16,44,5,1],[26,44,5,1],[16,45,5,1],[26,45,5,1]];
const C=['#000','#fedd15','#704421','#fff'];function art(){let s='<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">';for(const r of RUNS)s+='<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="1" fill="'+C[r[3]]+'"/>';return s+'</svg>'}
const world=document.getElementById('world'),p=document.getElementById('player'),state=document.getElementById('state'),orb=document.getElementById('orb');p.innerHTML=art();let x=90,y=0,vy=0,L=0,R=0,face=1,last=performance.now(),history=[],energy=0;
function bind(id,k){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(k==='L')L=1;else R=1};b.onpointerup=b.onpointercancel=()=>{if(k==='L')L=0;else R=0}}bind('left','L');bind('right','R');
function jump(){if(y===0)vy=12}document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jump()};
document.getElementById('rewind').onpointerdown=e=>{e.preventDefault();if(energy&&history.length){const h=history[Math.max(0,history.length-120)];x=h.x;y=h.y;vy=h.vy;energy--;orb.style.display='block';state.textContent='PEEL BACK!'}};
function ghost(g){const d=document.createElement('div');d.className='banana ghost';d.innerHTML=art();d.style.left=g.x+'px';d.style.bottom=(111+g.y)+'px';d.style.transform='scaleX('+g.face+')';world.insertBefore(d,document.getElementById('controls'));setTimeout(()=>d.remove(),450)}
function loop(t){const dt=Math.min((t-last)/16.67,2);last=t;let dx=(R-L)*5*dt;if(dx){x+=dx;face=dx<0?-1:1}if(vy||y){y+=vy*dt;vy-=.68*dt;if(y<0){y=0;vy=0}}x=Math.max(-35,Math.min(innerWidth-157,x));history.push({x,y,vy,face});if(history.length>180)history.shift();if(Math.floor(t/100)%5===0&&(dx||y))ghost({x,y,face});
p.style.left=x+'px';p.style.bottom=(111+y)+'px';p.style.transform='scaleX('+face+')';state.textContent=y?'JUMP':(dx?'MOVE':'IDLE');
const pr=p.getBoundingClientRect(),or=orb.getBoundingClientRect();if(orb.style.display!=='none'&&pr.right>or.left&&pr.left<or.right&&pr.bottom>or.top&&pr.top<or.bottom){orb.style.display='none';energy=1;state.textContent='TIME CHARGE GET!'}
document.getElementById('rewind').style.opacity=energy?1:.35;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
